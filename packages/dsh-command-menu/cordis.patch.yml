# dsh-command-menu bundle patch: `dsh plugin --profile web add dsh-command-menu`
# reads `dsh.bundle.patch` from package.json and merges this layer into the
# profile, which inserts the plugin row. Configure it with a profile patch that
# targets the `command-menu` id (see README "Configuration").
- insert:
    - id: command-menu
      name: dsh-command-menu
