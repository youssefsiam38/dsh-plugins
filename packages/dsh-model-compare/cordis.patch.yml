# dsh-model-compare bundle patch: `dsh plugin --profile web add dsh-model-compare`
# reads `dsh.bundle.patch` from package.json and merges this layer into the
# profile, which inserts the plugin row. Configure it with a profile patch that
# targets the `model-compare` id (see README "Configuration").
- insert:
    - id: model-compare
      name: dsh-model-compare
